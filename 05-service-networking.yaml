apiVersion: v1
kind: Namespace
metadata:
  name: troubleshooting-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: endpoint-target
  namespace: troubleshooting-lab
  labels:
    app: endpoint-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: endpoint-target
  template:
    metadata:
      labels:
        app: endpoint-target
    spec:
      containers:
        - name: target
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ["echo 'Endpoint selector target is running'; while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: crash-demo-service
  namespace: troubleshooting-lab
spec:
  type: ClusterIP
  selector:
    # Intentional mismatch. The target Deployment is labelled app=endpoint-target.
    app: service-demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
