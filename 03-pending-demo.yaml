apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-demo
  namespace: troubleshooting-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pending-demo
  template:
    metadata:
      labels:
        app: pending-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ["echo 'Application started'; while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: "100m"
              memory: "16Mi"