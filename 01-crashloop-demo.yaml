apiVersion: v1
kind: Namespace
metadata:
  name: troubleshooting-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-demo
  namespace: troubleshooting-lab
  labels:
    app: crash-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crash-demo
  template:
    metadata:
      labels:
        app: crash-demo
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args: ["echo 'Application started successfully'; while true; do sleep 3600; done"]
        resources:
          requests:
            cpu: 25m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
