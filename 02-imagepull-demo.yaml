apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagepull-demo
  namespace: troubleshooting-lab
  labels:
    app: imagepull-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imagepull-demo
  template:
    metadata:
      labels:
        app: imagepull-demo
    spec:
      containers:
        - name: app
          image: busybox:tag-that-does-not-exist
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args: ["echo 'This should not start until the image reference is corrected'; while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
