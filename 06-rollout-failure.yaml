apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-demo
  namespace: troubleshooting-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rollout-demo
  template:
    metadata:
      labels:
        app: rollout-demo
    spec:
      containers:
        - name: app
          image: nginx:tag-that-does-not-exist
          imagePullPolicy: Always
          ports:
            - containerPort: 80
